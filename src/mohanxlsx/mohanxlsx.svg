  <rect x="76" y="12" width="18" height="4" rx="2" fill="#e8f0f8" opacity="0.7"/>
  <rect x="106" y="12" width="12" height="4" rx="2" fill="#e8f0f8" opacity="0.7"/>
  <!-- data rows -->
  <rect x="12" y="42" width="20" height="4" rx="2" fill="#8fbfe0" opacity="0.6"/>
  <rect x="44" y="42" width="20" height="4" rx="2" fill="#8fbfe0" opacity="0.6"/>
  <rect x="12" y="64" width="20" height="4" rx="2" fill="#8fbfe0" opacity="0.6"/>
  <rect x="44" y="64" width="20" height="4" rx="2" fill="#8fbfe0" opacity="0.6"/>
  <rect x="12" y="86" width="20" height="4" rx="2" fill="#8fbfe0" opacity="0.6"/>
  <rect x="44" y="86" width="20" height="4" rx="2" fill="#8fbfe0" opacity="0.6"/>
