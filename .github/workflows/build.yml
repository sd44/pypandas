name: Build

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-22.04, ubuntu-22.04-arm, windows-2022]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check-out repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Build Executable
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: app.py
          mode: onefile
          enable-plugins: pyside6
          disable-console: true
          lto: yes
          output-dir: release
          output-file: 墨韩表格工具箱
          company-name: 墨韩
          file-version: 0.1.0beta
          enable-qt-plugins: platforminputcontexts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: 墨韩表格工具箱-${{ runner.os }}-${{ runner.arch }}
          path: |
            release/墨韩表格工具箱*
          include-hidden-files: true
