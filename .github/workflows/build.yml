name: Build

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check-out repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install Dependencies
        run: pip install .

      - name: Build Executable
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: src/mohanxlsx/app.py
          mode: onefile
          enable-plugins: pyside6
          windows-console-mode: disable
          lto: yes
          output-dir: release
          output-file: 墨韩表格工具箱
          company-name: 墨韩
          file-version: 0.1.2
          include-qt-plugins: platforminputcontexts
          windows-icon-from-ico: ${{ runner.os == 'Windows' && 'src/mohanxlsx/mohanxlsx.ico' || '' }}
          macos-app-icon: ${{ runner.os == 'macOS' && 'src/mohanxlsx/mohanxlsx.icns' || '' }}
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: 墨韩表格工具箱-${{ runner.os }}-${{ runner.arch }}
          path: |
            release/墨韩表格工具箱*
          include-hidden-files: true
